name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint
        run: flake8 app --max-line-length=100 --extend-ignore=E203

      - name: Run tests
        env:
          SMART_RETAIL_API_KEY: test-key
        run: pytest tests/ -v

  build-image:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t smart-retail-ai:latest .

      # Add a push step here (Docker Hub / GHCR / Render / Railway deploy
      # hook) once you've picked a hosting target.
